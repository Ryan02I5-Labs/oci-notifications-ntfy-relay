version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    # GitHub's merge queue tests on the latest main, so behind branches need no rebase
    # (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#rebase-strategy--).
    rebase-strategy: disabled
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    # GitHub's merge queue tests on the latest main, so behind branches need no rebase
    # (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#rebase-strategy--).
    rebase-strategy: disabled
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    # GitHub's merge queue tests on the latest main, so behind branches need no rebase
    # (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#rebase-strategy--).
    rebase-strategy: disabled
